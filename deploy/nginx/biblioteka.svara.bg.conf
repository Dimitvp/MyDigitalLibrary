# Host-level reverse proxy for biblioteka.svara.bg.
#
# Runs as system nginx on the Docker host (NOT inside docker-compose) — same
# pattern as svara.bg's own deploy/nginx/svara.conf on this same server, a
# separate server{} block/file per site rather than one shared config. This
# is the single public entry point on ports 80/443 for this subdomain; the
# `web` container itself is bound to 127.0.0.1 only (see docker-compose.prod.yml).
#
# `web` already does its own internal reverse-proxying to `api` for
# /api, /health, /covers (see src/web/nginx.conf) — so unlike svara.bg's host
# config, there's only ever one upstream to route to here.
#
# Install: copy to /etc/nginx/sites-available/biblioteka.svara.bg.conf,
# symlink into sites-enabled, `nginx -t && systemctl reload nginx`.
#
# Add the DNS record first (Hetzner DNS, same zone as svara.bg): A record
# `biblioteka` -> 46.62.253.87. Then:
#   certbot --nginx -d biblioteka.svara.bg
# rewrites the `listen` directives below to add TLS (443) and the http->https
# redirect; until then this serves plain HTTP.

upstream biblioteka_web { server 127.0.0.1:4201; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name biblioteka.svara.bg;

    client_max_body_size 8m;

    location / {
        proxy_pass         http://biblioteka_web;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
