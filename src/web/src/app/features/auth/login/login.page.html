<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>{{ 'auth.login.title' | transloco }}</h1>

    <label>
      <span>{{ 'auth.login.email' | transloco }}</span>
      <input type="email" formControlName="email" autocomplete="username" />
    </label>

    <label>
      <span>{{ 'auth.login.password' | transloco }}</span>
      <div class="password-field">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="toggleShowPassword()"
          [attr.aria-label]="(showPassword() ? 'auth.login.hidePassword' : 'auth.login.showPassword') | transloco"
          [attr.aria-pressed]="showPassword()"
        >
          @if (showPassword()) {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <path
                d="M10.6 5.1c.45-.07.92-.1 1.4-.1 5 0 8.5 4 9.9 6.7.25.5.25 1.1 0 1.6-.5 1-1.4 2.4-2.7 3.7M6.6 6.6C4.4 8.1 2.8 10.1 2.1 11.3a1.8 1.8 0 0 0 0 1.6C3.5 15.6 7 19.6 12 19.6c1.2 0 2.3-.2 3.4-.6"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M9.9 9.9a2.6 2.6 0 0 0 3.6 3.6"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M2.1 12.9a1.8 1.8 0 0 1 0-1.6C3.5 8.4 7 4.4 12 4.4s8.5 4 9.9 6.9a1.8 1.8 0 0 1 0 1.6c-1.4 2.7-4.9 6.7-9.9 6.7s-8.5-4-9.9-6.7Z"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
              <circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.6" />
            </svg>
          }
        </button>
      </div>
    </label>

    <button type="submit" [disabled]="form.invalid || submitting()">
      {{ 'auth.login.submit' | transloco }}
    </button>
  </form>
</div>
