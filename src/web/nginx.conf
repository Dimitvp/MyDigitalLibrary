# In production this container sits behind a second, host-level nginx that
# already terminates TLS and sets X-Forwarded-Proto correctly — if that
# header is already present, pass it through unchanged; only fall back to
# this container's own $scheme (plain http) when there's no outer proxy at
# all, e.g. local dev via docker-compose directly. Using bare $scheme
# unconditionally here would silently downgrade every request to "http" as
# seen by the API's own ForwardedHeadersMiddleware, even on a live HTTPS
# site — the same class of bug already hit and fixed once on svara.bg.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── API ───────────────────────────────────────────────────────────────────────
    # ^~ stops nginx from falling through to the image-extension regex location
    # below for /covers/*.jpg etc. — a bare prefix location loses to a regex
    # location, ^~ makes this prefix win outright.
    location ^~ /api/ {
        proxy_pass         http://api:8080;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Cookie            $http_cookie;
    }

    location ^~ /health/ {
        proxy_pass         http://api:8080;
        proxy_set_header   Host              $http_host;
    }

    location ^~ /covers/ {
        proxy_pass         http://api:8080;
        proxy_set_header   Host              $http_host;
    }

    # ── Angular SPA ───────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache-bust hashed assets for 1 year
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache index.html — it carries the hashed asset filenames
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
