services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-backup:/backup:ro
      - ./docker/db-init/10-restore-if-exists.sh:/docker-entrypoint-initdb.d/10-restore-if-exists.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-backup:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db-backup:/backup
      - ./docker/db-backup/backup.sh:/scripts/backup.sh:ro
    command: ["sh", "/scripts/backup.sh"]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/MyDigitalLibrary.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MyDigitalLibrary: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      GoogleBooks__ApiKey: ${GOOGLE_BOOKS_API_KEY}
      Covers__RootDirectory: /app/covers
    volumes:
      - covers:/app/covers
      - dpkeys:/app/keys
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  covers:
  dpkeys:
